<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Notes - Notes Taking App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>


<body>

    <!-- =================================
         HEADER
         ================================= -->

    <header class="header">

        <div class="container header-content">

            <h1>📝 My Notes</h1>

            <nav class="navbar">

                <a href="index.html">
                    Home
                </a>

                <a href="pages/about.html">
                    About
                </a>

                <a href="pages/login.html">
                    Login
                </a>

                <button
                    id="darkModeBtn"
                    class="icon-btn"
                    title="Toggle Dark Mode"
                    type="button"
                >
                    🌙
                </button>

            </nav>

        </div>

    </header>


    <!-- =================================
         MAIN
         ================================= -->

    <main class="container">

        <!-- Toolbar -->

        <section class="toolbar">

            <!-- Search -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search your notes..."
                    autocomplete="off"
                >

                <span>🔍</span>

            </div>


            <!-- Add Note -->

            <button
                id="addNoteBtn"
                class="add-btn"
                type="button"
            >
                + Add Note
            </button>

        </section>


        <!-- =================================
             NOTES
             ================================= -->

        <section class="notes-section">

            <div
                id="notesContainer"
                class="notes-container"
            >
                <!-- Notes will be generated by JavaScript -->
            </div>


            <!-- Empty State -->

            <div
                id="emptyState"
                class="empty-state"
            >

                <div class="empty-icon">
                    📒
                </div>

                <h2>
                    No Notes Yet
                </h2>

                <p>
                    Create your first note to get started.
                </p>

                <button
                    id="emptyAddBtn"
                    class="add-btn"
                    type="button"
                >
                    + Create Note
                </button>

            </div>

        </section>

    </main>


    <!-- =================================
         ADD / EDIT NOTE MODAL
         ================================= -->

    <div
        id="noteModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-content">

            <!-- Modal Header -->

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add New Note
                </h2>

                <button
                    id="closeModalBtn"
                    class="close-btn"
                    type="button"
                    aria-label="Close"
                >
                    &times;
                </button>

            </div>


            <!-- Note Form -->

            <form id="noteForm">

                <!-- Title -->

                <div class="form-group">

                    <label for="noteTitle">
                        Title
                    </label>

                    <input
                        type="text"
                        id="noteTitle"
                        placeholder="Enter note title"
                        maxlength="100"
                        required
                    >

                </div>


                <!-- Content -->

                <div class="form-group">

                    <label for="noteContent">
                        Note
                    </label>

                    <textarea
                        id="noteContent"
                        rows="8"
                        placeholder="Write your note here..."
                        maxlength="5000"
                        required
                    ></textarea>

                </div>


                <!-- Buttons -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveNoteBtn"
                        class="save-btn"
                    >
                        Save Note
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =================================
         JAVASCRIPT
         ================================= -->

    <!-- Storage must load first -->
    <script src="js/storage.js"></script>

    <!-- Notes functionality -->
    <script src="js/notes.js"></script>

    <!-- Search functionality -->
    <script src="js/search.js"></script>

    <!-- Main application -->
    <script src="js/script.js"></script>

</body>

</html>
